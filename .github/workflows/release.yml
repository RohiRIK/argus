name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          {
            echo "### Container Images (\`linux/amd64\`, \`linux/arm64\`)"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/rohirik/argus:${VERSION}"
            echo "\`\`\`"
            echo ""
          } > "$NOTES_FILE"

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG
