services:
  argus-dev:
    image: ghcr.io/rohirik/argus:${ARGUS_IMAGE_TAG:-dev}
    build: .
    container_name: argus-dev
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DEV_PORT:-8101}:8100"
    environment:
      ARGUS_MASTER_KEY: ${ARGUS_DEV_MASTER_KEY:-${ARGUS_MASTER_KEY:?Set ARGUS_DEV_MASTER_KEY or ARGUS_MASTER_KEY}}
      ARGUS_ENV: dev
      ARGUS_DB_PATH: /app/data/argus-dev.db
      PORT: "8100"
    volumes:
      - argus-dev-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:8100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  argus-dev-data:
