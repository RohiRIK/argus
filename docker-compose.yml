services:
  argus:
    image: ghcr.io/rohirik/argus:${ARGUS_IMAGE_TAG:-latest}
    build: .
    container_name: argus
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only by default. To expose Argus to other machines, put an HTTPS
      # reverse proxy in front, or set ARGUS_BIND=0.0.0.0 on a trusted network.
      # Either way the operator access gate stays on (bun run auth:access-key).
      - "${ARGUS_BIND:-127.0.0.1}:${PORT:-8100}:8100"
    environment:
      # The only required secret. Generate with: openssl rand -hex 32
      ARGUS_MASTER_KEY: ${ARGUS_MASTER_KEY:?ARGUS_MASTER_KEY must be set (openssl rand -hex 32)}
      ARGUS_ENV: ${ARGUS_ENV:-production}
      ARGUS_DB_PATH: /app/data/argus.db
      PORT: "8100"
    volumes:
      - argus-data:/app/data
    restart: unless-stopped
    healthcheck:
      # oven/bun has no curl; use Bun's fetch.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:8100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  argus-data:
